--- # Find the built DACPAC package
# Dispatcher-specific: not sourced from a shared template.
# Duplicates the "Dotnet: Find Dacpac" step in the template-owned
# .github/actions/database-deploy/action.yml (funfair-server-template) - that file can't be
# edited to call this action, so the two must be kept in sync by hand.
name: 'Find DACPAC'
description: 'Locates the built .dacpac file under src/'

outputs:
  DACPAC:
    description: 'Full path to the found .dacpac file'
    value: ${{steps.find_dacpac.outputs.DACPAC}}

runs:
  using: "composite"
  steps:
    - name: "Find DACPAC"
      id: find_dacpac
      shell: bash
      run: |
        DACPAC="$(find "$GITHUB_WORKSPACE/src" -type f -iname "*.dacpac" | head -1)"
        if [ -z "$DACPAC" ]; then
          echo "::error::DACPAC not found"
          exit 1
        fi
        echo "✅ Found: $DACPAC"
        echo "DACPAC=$DACPAC" >> "$GITHUB_OUTPUT"

--- # Runs super-linter with the settings appropriate to the calling context
name: "Run Super-Linter"
description: "Runs super-linter/super-linter with the validation matrix and file discovery mode appropriate to the caller"
inputs:
  mode:
    description: "Which validation matrix to apply: 'pr' (full PR lint pass) or 'sql' (SQLFluff-only, minimal scope, see #869)"
    required: true
  github-token:
    description: "GitHub token"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Validate Mode"
      if: inputs.mode != 'pr' && inputs.mode != 'sql'
      shell: bash
      env:
        MODE: ${{inputs.mode}}
      run: |
        echo "::error::Unsupported mode '$MODE' (expected 'pr' or 'sql')"
        exit 1

    # File discovery is fixed per mode, not a caller input: each mode has a known checkout
    # pattern, so the discovery settings that suit it are encoded here rather than left to callers.
    #   - sql: reached via build/action.yml's dotnet build path, called from
    #     build-and-publish-pre-release.yml, which on pull_request runs checks out the PR head
    #     commit, so GITHUB_SHA (the merge commit) is never fetched and super-linter's Git mode
    #     fails validating it. Step env cannot override GITHUB_SHA for a docker action, so the
    #     find algorithm is used instead, which skips Git variable initialisation and SHA
    #     validation. Find mode ignores .gitignore by default, so build output folders (where SQL
    #     projects emit generated scripts) are excluded explicitly.
    #   - pr: pr-lint.yml's checkout never overrides `ref:`, so its default checkout already
    #     agrees with the default GITHUB_SHA; overriding it here would break that agreement.

    - name: "Run Linter (PR)"
      if: inputs.mode == 'pr'
      uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
      env:
        GITHUB_TOKEN: ${{inputs.github-token}}
        CLOUDFORMATION_CONFIG_FILE: .cfnlintrc.yaml
        DEFAULT_BRANCH: main
        ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
        GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
        MULTI_STATUS: true
        SAVE_SUPER_LINTER_SUMMARY: true
        SQLFLUFF_CONFIG_FILE: .sqlfluff
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_ANSIBLE: true
        VALIDATE_BASH: true
        VALIDATE_CLOUDFORMATION: true
        VALIDATE_CSS: true
        VALIDATE_DOCKERFILE: true
        VALIDATE_DOCKERFILE_HADOLINT: true
        VALIDATE_ENV: true
        VALIDATE_GITHUB_ACTIONS: true
        VALIDATE_JSON: true
        VALIDATE_MD: true
        VALIDATE_POWERSHELL: true
        VALIDATE_PYTHON: true
        VALIDATE_PYTHON_PYLINT: true
        VALIDATE_SQLFLUFF: true
        VALIDATE_TYPESCRIPT_ES: true
        VALIDATE_XML: true
        VALIDATE_YAML: true

    - name: "Run Linter (SQL)"
      if: inputs.mode == 'sql'
      uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
      env:
        GITHUB_TOKEN: ${{inputs.github-token}}
        ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
        ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
        FILTER_REGEX_EXCLUDE: '(^|/)([Bb]in|[Oo]bj)/'
        MULTI_STATUS: false
        SAVE_SUPER_LINTER_SUMMARY: false
        SQLFLUFF_CONFIG_FILE: .sqlfluff
        USE_FIND_ALGORITHM: true
        VALIDATE_SQLFLUFF: true
